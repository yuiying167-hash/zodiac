        if(!y||!m||!d){document.getElementById('searchResult').innerText="⚠️ กรุณาใส่วันเกิดให้ครบ";return}
        const idate=m*100+d, ldate=lunarNewYears[y];
        let zYear=y; if(idate<ldate) zYear=y-1;
        let idx=(zYear-1900)%12; if(idx<0) idx+=12;
        const zName=zodiacNamesTh[idx], zIcon=zodiacs[idx].icon;
        document.getElementById('searchResult').innerHTML=`<span style="font-size:2rem;display:block;margin-bottom:5px;">${zIcon}</span>คุณเกิดปี <strong>${zName}</strong>`;
        setTimeout(()=>{closeModal();document.querySelectorAll('#my-grid .zodiac-item')[idx].click();document.getElementById('my-grid').scrollIntoView({behavior:'smooth',block:'center'});},2000);
    }

    window.onload = function() { initDateSelect(); createStars(); createHearts(); createGrid('my-grid', false); createGrid('partner-grid', true); };
</script>

</body>
